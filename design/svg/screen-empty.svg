<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Пустое состояние Мои поездки</title>
  <desc id="desc">Светло-серая карточка, векторная иллюстрация билетов и кнопка добавления.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#192B59" flood-opacity="0.12"/></filter>
    <style>text { font-family: Inter, "SF Pro Display", "Segoe UI", Arial, sans-serif; fill: #0B1324; } text[fill="#FFFFFF"] { fill: #FFFFFF; }</style>
  </defs>
  <rect width="390" height="844" fill="#FFFFFF"/>
  <text x="20" y="65" font-size="38" font-weight="800" letter-spacing="-1.8">Мои поездки</text>
  <rect x="18" y="104" width="354" height="440" rx="30" fill="#F2F5F8"/>

  <g transform="translate(110 145)" filter="url(#shadow)">
    <g transform="rotate(-9 62 50)">
      <rect x="0" y="0" width="112" height="74" rx="16" fill="#FFE9A6"/>
      <path d="M22 20h68v8a8 8 0 0 0 0 16v8H22v-8a8 8 0 0 0 0-16z" fill="none" stroke="#9B7100" stroke-width="2"/>
    </g>
    <g transform="translate(49 35) rotate(7 62 50)">
      <rect x="0" y="0" width="122" height="78" rx="17" fill="#0877F9"/>
      <g transform="translate(47 21)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M28 18 17 14v8l3 3v2l-7-2-7 2v-2l3-3v-8L0 18v-3L9 9V2a4 4 0 0 1 8 0v7l11 6z"/>
      </g>
    </g>
  </g>

  <text x="195" y="327" font-size="25" font-weight="800" text-anchor="middle">Пока нет поездок</text>
  <text x="195" y="365" font-size="16" text-anchor="middle" fill="#7D8490">Добавьте PDF-билет и данные маршрута.</text>
  <text x="195" y="389" font-size="16" text-anchor="middle" fill="#7D8490">Первая поездка появится здесь.</text>
  <rect x="62" y="428" width="266" height="58" rx="16" fill="#0877F9"/>
  <g transform="translate(111 447)" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M10 0v20M0 10h20"/></g>
  <text x="211" y="464" font-size="17" font-weight="800" text-anchor="middle" fill="#FFFFFF">Добавить билет</text>

  <g transform="translate(0 766)">
    <rect width="390" height="78" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#E3E8EF"/>
    <g transform="translate(98 13)" fill="none" stroke="#0877F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 4h24v6a5 5 0 0 0 0 10v6h-24v-6a5 5 0 0 0 0-10z"/><path d="M2 8v4m0 7v4"/></g>
    <text x="98" y="60" font-size="12" font-weight="800" text-anchor="middle" fill="#0877F9">Поездки</text>
    <g transform="translate(292 23)" stroke="#8DA5C9" stroke-width="2" stroke-linecap="round"><path d="M0-10v20M-10 0h20"/></g>
    <text x="292" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="#8DA5C9">Добавить</text>
  </g>
</svg>
