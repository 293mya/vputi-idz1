    .label { font-size: 13px; font-weight: 700; fill: #263247; }
    .muted { fill: #7D8490; }
  </style>
  <rect width="390" height="844" fill="#FFFFFF"/>
  <text x="20" y="56" font-size="36" font-weight="800" letter-spacing="-1.8">Добавить билет</text>
  <text x="20" y="82" font-size="14" class="muted">Загрузите PDF и заполните маршрут</text>

