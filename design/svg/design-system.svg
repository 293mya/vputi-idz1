<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Дизайн-система приложения впути</title>
  <desc id="desc">Палитра, типографика, скругления, кнопки, поля, транспорт и карточка поездки.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#192B59" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Inter, "SF Pro Display", "Segoe UI", Arial, sans-serif; fill: #0B1324; }
      text[fill="#FFFFFF"] { fill: #FFFFFF; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: .08em; fill: #7D8490; }
      .title { font-size: 52px; font-weight: 800; letter-spacing: -.04em; }
      .h2 { font-size: 28px; font-weight: 800; }
      .body { font-size: 18px; font-weight: 400; fill: #263247; }
      .small { font-size: 14px; font-weight: 500; fill: #7D8490; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; fill: #263247; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
