<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Экран Добавить билет</title>
  <desc id="desc">Форма выбора транспорта, PDF, маршрута, даты и времени.</desc>
  <style>
