<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">SVG-иконки приложения впути</title>
  <desc id="desc">Самолёт, поезд, автобус, билет, плюс, загрузка, меню, редактирование и удаление.</desc>
  <defs>
    <symbol id="icon-plane" viewBox="0 0 24 24"><path d="M21.2 16.2 13 13.1V19l2.1 1.5V22L12 21l-3.1 1v-1.5L11 19v-5.9l-8.2 3.1v-2L11 9V3.7a1 1 0 0 1 2 0V9l8.2 5.2v2Z"/></symbol>
    <symbol id="icon-train" viewBox="0 0 24 24"><path d="M7 3h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3ZM4 9h16M7 19l-2 3m12-3 2 3M8 15h.01M16 15h.01"/></symbol>
    <symbol id="icon-bus" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2ZM3 10h18M7 19v2m10-2v2M7 15h.01M17 15h.01"/></symbol>
    <symbol id="icon-ticket" viewBox="0 0 24 24"><path d="M4 5h16v4a3 3 0 0 0 0 6v4H4v-4a3 3 0 0 0 0-6V5ZM13 8v2m0 4v2"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4M8 8l4-4 4 4M5 14v5h14v-5"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="m4 20 4.2-1 10.4-10.4a2 2 0 0 0-2.8-2.8L5.4 16.2 4 20Zm10.2-12.8 2.8 2.8"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5"/></symbol>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #0B1324; }
      .icon { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="720" height="360" fill="#FFFFFF"/>
  <text x="40" y="54" font-size="30" font-weight="800">SVG-иконки 24 × 24</text>
  <text x="40" y="82" font-size="14" fill="#7D8490">Контур 1.8 px · currentColor · круглые окончания</text>

  <g color="#0877F9">
    <g transform="translate(40 120)"><rect width="100" height="88" rx="18" fill="#E3EFFF"/><svg class="icon" x="34" y="14" width="32" height="32"><use href="#icon-plane"/></svg><text x="50" y="69" text-anchor="middle" font-size="13" font-weight="700">Самолёт</text></g>
    <g transform="translate(152 120)"><rect width="100" height="88" rx="18" fill="#E3EFFF"/><svg class="icon" x="34" y="14" width="32" height="32"><use href="#icon-train"/></svg><text x="50" y="69" text-anchor="middle" font-size="13" font-weight="700">Поезд</text></g>
    <g transform="translate(264 120)"><rect width="100" height="88" rx="18" fill="#E3EFFF"/><svg class="icon" x="34" y="14" width="32" height="32"><use href="#icon-bus"/></svg><text x="50" y="69" text-anchor="middle" font-size="13" font-weight="700">Автобус</text></g>
    <g transform="translate(376 120)"><rect width="100" height="88" rx="18" fill="#E3EFFF"/><svg class="icon" x="34" y="14" width="32" height="32"><use href="#icon-ticket"/></svg><text x="50" y="69" text-anchor="middle" font-size="13" font-weight="700">Билет</text></g>
    <g transform="translate(488 120)"><rect width="100" height="88" rx="18" fill="#E3EFFF"/><svg class="icon" x="34" y="14" width="32" height="32"><use href="#icon-plus"/></svg><text x="50" y="69" text-anchor="middle" font-size="13" font-weight="700">Добавить</text></g>
    <g transform="translate(600 120)"><rect width="80" height="88" rx="18" fill="#E3EFFF"/><svg class="icon" x="24" y="14" width="32" height="32"><use href="#icon-upload"/></svg><text x="40" y="69" text-anchor="middle" font-size="12" font-weight="700">PDF</text></g>
  </g>
  <g color="#263247">
    <g transform="translate(40 230)"><rect width="100" height="72" rx="18" fill="#F2F5F8"/><svg class="icon" x="34" y="12" width="32" height="32"><use href="#icon-menu"/></svg><text x="50" y="60" text-anchor="middle" font-size="12">Меню</text></g>
    <g transform="translate(152 230)"><rect width="100" height="72" rx="18" fill="#F2F5F8"/><svg class="icon" x="34" y="12" width="32" height="32"><use href="#icon-edit"/></svg><text x="50" y="60" text-anchor="middle" font-size="12">Изменить</text></g>
    <g transform="translate(264 230)" color="#C83D50"><rect width="100" height="72" rx="18" fill="#FFF0F2"/><svg class="icon" x="34" y="12" width="32" height="32"><use href="#icon-trash"/></svg><text x="50" y="60" text-anchor="middle" font-size="12" fill="#C83D50">Удалить</text></g>
  </g>
</svg>
